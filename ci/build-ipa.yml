# ACHTUNG: Diese Datei ist nur eine Sicherungskopie. Der aktive Workflow liegt
# unter .github/workflows/build-ipa.yml – Änderungen bitte dort machen und ggf.
# hierher spiegeln (GitHub liest ausschließlich .github/workflows/).
name: Build IPA (Sideload)

# Baut aus dem Swift-Package ein unsigniertes .ipa, das z. B. mit
# Sideloadly oder AltStore auf einem iPad installiert werden kann.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    name: PlanApp.ipa bauen
    runs-on: macos-26
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Neuestes Xcode auswählen
        shell: bash
        run: |
          set -euo pipefail
          XCODE=$(
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              version=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version | awk 'NR == 1 { print $2 }')
              printf '%s\t%s\n' "$version" "$app"
            done | sort -k1,1V | tail -n 1 | cut -f2-
          )
          if [ -z "$XCODE" ]; then
            echo "::error::Kein Xcode gefunden"
            exit 1
          fi
          echo "Verwende: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build-Schema automatisch ermitteln
        working-directory: PlanApp.swiftpm
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list
          xcodebuild -list -json > "$RUNNER_TEMP/xcodebuild-list.json"
          SCHEME=$(python3 - "$RUNNER_TEMP/xcodebuild-list.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              listing = json.load(file)

          for container in ("workspace", "project"):
              schemes = listing.get(container, {}).get("schemes", [])
              if schemes:
                  print(schemes[0])
                  break
          else:
              raise SystemExit("Kein Build-Schema gefunden")
          PY
          )
          echo "Ermitteltes Schema: $SCHEME"
          echo "APP_SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: App bauen (unsigniert)
        working-directory: PlanApp.swiftpm
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: IPA paketieren
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$APP_DIR" ]; then
            echo "::error::Kein App-Bundle gefunden"
            exit 1
          fi
          echo "App-Bundle: $APP_DIR"
          rm -rf Payload PlanApp.ipa
          mkdir Payload
          cp -R "$APP_DIR" Payload/
          zip -qry PlanApp.ipa Payload
          ls -lh PlanApp.ipa

      - name: IPA als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PlanApp-IPA
          path: PlanApp.ipa
          if-no-files-found: error
          retention-days: 90
